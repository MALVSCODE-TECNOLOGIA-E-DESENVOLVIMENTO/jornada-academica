<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada Acadêmica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>Jornada Acadêmica</h1>
            <p>Faça login para acessar seus estudos</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
                <p id="login-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <!-- TELA DO APP -->
    <div id="app-screen" class="app-container" style="display: none;">
        <header class="header">
            <div class="header-left">
                <h1>Jornada Acadêmica</h1>
                <span id="user-name" class="user-badge"></span>
            </div>
            <div class="header-right">
                <button onclick="abrirModal()" class="btn-primary">+ Novo Registro</button>
                <button onclick="logout()" class="btn-logout" title="Sair">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <!-- DASHBOARDS -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-icon bg-blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div>
                <div class="stat-content">
                    <span class="stat-label">Conteúdos</span>
                    <strong class="stat-value" id="dash-total">0</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-green"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                <div class="stat-content">
                    <span class="stat-label">Concluídos</span>
                    <strong class="stat-value" id="dash-concluidos">0</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-red"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
                <div class="stat-content">
                    <span class="stat-label">Alerta de Conteúdo</span>
                    <strong class="stat-value" id="dash-alerta">0</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-yellow"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></div>
                <div class="stat-content">
                    <span class="stat-label">Desempenho Geral</span>
                    <strong class="stat-value" id="dash-desempenho">0%</strong>
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="card table-card">
            <div class="search-bar">
                <input type="text" id="search" placeholder="Buscar por matéria ou conteúdo..." oninput="renderTable()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Matéria</th>
                        <th>Conteúdo</th>
                        <th>Data</th>
                        <th>Desempenho</th>
                        <th>Situação</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE REGISTRO -->
    <div id="modal-form" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Novo Registro de Estudo</h2>
                <button onclick="fecharModal()" class="close-btn">&times;</button>
            </div>
            <form id="form-registro">
                <input type="hidden" id="registro-id">
                <div class="form-group">
                    <label>Matéria *</label>
                    <select id="materia" required>
                        <option value="">Selecione...</option>
                        <option value="Língua Portuguesa">Língua Portuguesa</option>
                        <option value="Ética, Compliance e ESG">Ética, Compliance e ESG</option>
                        <option value="Matemática/Raciocínio Lógico Quantitativo">Matemática/Raciocínio Lógico Quantitativo</option>
                        <option value="Atualidades do Mercado Financeiro">Atualidades do Mercado Financeiro</option>
                        <option value="Conhecimentos Bancários/Securitários">Conhecimentos Bancários/Securitários</option>
                        <option value="Matemática Financeira">Matemática Financeira</option>
                        <option value="Noções de Probabilidade e Estatística">Noções de Probabilidade e Estatística</option>
                        <option value="Noções de Informática e Comportamentos Digitais">Noções de Informática e Comportamentos Digitais</option>
                        <option value="Vendas, Negociação e Atendimento">Vendas, Negociação e Atendimento</option>
                        <option value="Inteligência Emocional">Inteligência Emocional</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Conteúdo *</label>
                    <input type="text" id="conteudo" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Data *</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label>QTD Questões *</label>
                        <input type="number" id="qtd_questoes" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>QTD Erros *</label>
                        <input type="number" id="qtd_erros" min="0" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" onclick="fecharModal()" class="btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
