<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F4F5F7">
    <meta name="color-scheme" content="light only">
    <title>Jornada Acadêmica</title>
    <link rel="icon" type="image/png" href="/apps/imagens/logo-navegador.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/ui-refined.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Topo: Título e Logout -->
    <div class="top-bar">
        <h1 class="system-title">Jornada Acadêmica</h1>
        <button onclick="logout()" class="btn-icon-logout" title="Sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
    </div>

    <!-- Dashboard 2x2 -->
    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-icon bg-blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            <div class="stat-content"><span class="stat-label">Conteúdos</span><strong class="stat-value" id="dash-total">0</strong></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div class="stat-content"><span class="stat-label">Concluídos</span><strong class="stat-value" id="dash-concluidos">0</strong></div>
        </div>
        <div class="stat-card clickable" onclick="abrirModalRevisao()">
            <div class="stat-icon bg-red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg>
            </div>
            <div class="stat-content"><span class="stat-label">Revisão</span><strong class="stat-value" id="dash-revisao">0</strong></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-yellow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            </div>
            <div class="stat-content"><span class="stat-label">Desempenho</span><strong class="stat-value" id="dash-desempenho">0%</strong></div>
        </div>
    </div>

    <!-- Barra de Pesquisa -->
    <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search" placeholder="Buscar conteúdo..." autocomplete="off" oninput="renderTable()">
    </div>

    <!-- Filtros -->
    <div class="filters">
        <select id="filter-materia" class="filter-select" onchange="renderTable()">
            <option value="">Matéria (Todas)</option>
        </select>
        <select id="filter-situacao" class="filter-select" onchange="renderTable()">
            <option value="">Desempenho (Todos)</option>
            <option value="ÓTIMO">ÓTIMO</option>
            <option value="BOM">BOM</option>
            <option value="RUIM">RUIM</option>
        </select>
    </div>

    <!-- Lista de Cards -->
    <div class="list" id="list-container"></div>

    <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon">📚</div>
        <div class="empty-title">Nenhum registro encontrado</div>
        <div class="empty-desc">Toque em <b>+</b> para cadastrar seu primeiro estudo.</div>
    </div>

    <!-- FAB Group -->
    <div class="fab-group">
        <div class="icons-row" id="iconsRow">
            <!-- Nenhum ícone extra necessário por padrão, mas deixamos a estrutura -->
        </div>
        <button class="fab-register" id="addBtn" type="button" onclick="abrirModal()" aria-label="Novo Registro" title="Novo Registro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
    </div>

    <!-- Modal Principal (Cadastro/Edição) -->
    <div class="modal" id="modal-form" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true">
            <header class="modal-head">
                <div class="modal-head-spacer"></div>
                <h2 class="modal-head-title" id="modal-title">Novo Registro</h2>
                <button class="modal-close" type="button" onclick="fecharModal()" aria-label="Fechar">✕</button>
            </header>

            <div class="modal-body">
                <form id="form-registro">
                    <input type="hidden" id="registro-id">
                    
                    <div class="field">
                        <label>Matéria *</label>
                        <select id="materia" required>
                            <option value="">Selecione...</option>
                            <option value="Língua Portuguesa">Língua Portuguesa</option>
                            <option value="Ética, Compliance e ESG">Ética, Compliance e ESG</option>
                            <option value="Matemática/Raciocínio Lógico Quantitativo">Matemática/Raciocínio Lógico Quantitativo</option>
                            <option value="Atualidades do Mercado Financeiro">Atualidades do Mercado Financeiro</option>
                            <option value="Conhecimentos Bancários/Securitários">Conhecimentos Bancários/Securitários</option>
                            <option value="Matemática Financeira">Matemática Financeira</option>
                            <option value="Noções de Probabilidade e Estatística">Noções de Probabilidade e Estatística</option>
                            <option value="Noções de Informática e Comportamentos Digitais">Noções de Informática e Comportamentos Digitais</option>
                            <option value="Vendas, Negociação e Atendimento">Vendas, Negociação e Atendimento</option>
                            <option value="Inteligência Emocional">Inteligência Emocional</option>
                        </select>
                    </div>
                    
                    <div class="field">
                        <label>Conteúdo *</label>
                        <input type="text" id="conteudo" required autocomplete="off">
                    </div>

                    <div class="field">
                        <label>Data *</label>
                        <input type="date" id="data" required>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label>Questões *</label>
                            <input type="number" id="qtd_questoes" min="15" required oninput="calcularDesempenhoModal()">
                        </div>
                        <div class="field">
                            <label>Erros *</label>
                            <input type="number" id="qtd_erros" min="0" required oninput="calcularDesempenhoModal()">
                        </div>
                    </div>

                    <div class="field">
                        <label>Desempenho Calculado</label>
                        <input type="text" id="desempenho_calculado" readonly style="background:#E5E7EB; font-weight:bold; color:#111;">
                    </div>
                </form>
            </div>

            <footer class="modal-foot">
                <button class="btn btn-green" type="button" onclick="salvarRegistro()">Salvar</button>
                <button class="btn btn-red" type="button" onclick="fecharModal()">Cancelar</button>
            </footer>
        </div>
    </div>

    <!-- Modal Revisão -->
    <div class="modal" id="modal-revisao" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true">
            <header class="modal-head">
                <div class="modal-head-spacer"></div>
                <h2 class="modal-head-title">Conteúdos para revisão</h2>
                <button class="modal-close" type="button" onclick="fecharModalRevisao()" aria-label="Fechar">✕</button>
            </header>

            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table-revisao">
                        <thead>
                            <tr><th>Matéria</th><th>Conteúdo</th><th>Data</th></tr>
                        </thead>
                        <tbody id="revisao-body"></tbody>
                    </table>
                </div>
            </div>

            <footer class="modal-foot">
                <button class="btn btn-red" type="button" onclick="fecharModalRevisao()">Fechar</button>
            </footer>
        </div>
    </div>

    <script src="/shared/ir-common.js"></script>
    <script src="script.js"></script>
</body>
</html>
