<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jornada Acadêmica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Top Bar Mobile -->
        <div class="top-bar">
            <h1 class="system-title">Jornada Acadêmica</h1>
            <button onclick="logout()" class="btn-icon" title="Sair">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>

        <!-- Dashboards (Mantendo Cores e Ícones) -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-icon bg-blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </div>
                <div class="stat-content"><span class="stat-label">Conteúdos</span><strong class="stat-value" id="dash-total">0</strong></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>
                <div class="stat-content"><span class="stat-label">Concluídos</span><strong class="stat-value" id="dash-concluidos">0</strong></div>
            </div>
            <div class="stat-card clickable" onclick="abrirModalRevisao()">
                <div class="stat-icon bg-red">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
                <div class="stat-content"><span class="stat-label">Revisão</span><strong class="stat-value" id="dash-revisao">0</strong></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-yellow">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                </div>
                <div class="stat-content"><span class="stat-label">Desempenho</span><strong class="stat-value" id="dash-desempenho">0%</strong></div>
            </div>
        </div>

        <!-- Filtros Mobile -->
        <div class="filters-mobile">
            <input type="text" id="search" placeholder="Buscar por conteúdo ou matéria..." oninput="renderTable()">
            <div class="filter-row">
                <select id="filter-materia" onchange="renderTable()">
                    <option value="">Matéria (Todas)</option>
                </select>
                <select id="filter-situacao" onchange="renderTable()">
                    <option value="">Desempenho (Todos)</option>
                    <option value="ÓTIMO">ÓTIMO</option>
                    <option value="BOM">BOM</option>
                    <option value="RUIM">RUIM</option>
                </select>
            </div>
        </div>

        <!-- Lista de Cards Mobile -->
        <div id="list-container" class="list-container"></div>
    </div>

    <!-- FAB (Botão Flutuante) -->
    <button onclick="abrirModal()" class="fab" title="Novo Registro">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Modal Principal (Bottom Sheet) -->
    <div id="modal-form" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Novo Registro</h2>
                <button onclick="fecharModal()" class="close-btn">&times;</button>
            </div>
            <form id="form-registro">
                <input type="hidden" id="registro-id">
                <div class="form-group">
                    <label>Matéria *</label>
                    <select id="materia" required>
                        <option value="">Selecione...</option>
                        <option value="Língua Portuguesa">Língua Portuguesa</option>
                        <option value="Ética, Compliance e ESG">Ética, Compliance e ESG</option>
                        <option value="Matemática/Raciocínio Lógico Quantitativo">Matemática/Raciocínio Lógico Quantitativo</option>
                        <option value="Atualidades do Mercado Financeiro">Atualidades do Mercado Financeiro</option>
                        <option value="Conhecimentos Bancários/Securitários">Conhecimentos Bancários/Securitários</option>
                        <option value="Matemática Financeira">Matemática Financeira</option>
                        <option value="Noções de Probabilidade e Estatística">Noções de Probabilidade e Estatística</option>
                        <option value="Noções de Informática e Comportamentos Digitais">Noções de Informática e Comportamentos Digitais</option>
                        <option value="Vendas, Negociação e Atendimento">Vendas, Negociação e Atendimento</option>
                        <option value="Inteligência Emocional">Inteligência Emocional</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Conteúdo *</label>
                    <input type="text" id="conteudo" required>
                </div>
                <div class="form-group">
                    <label>Data *</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>QTD Questões *</label>
                        <input type="number" id="qtd_questoes" min="1" required oninput="calcularDesempenhoModal()">
                    </div>
                    <div class="form-group">
                        <label>QTD Erros *</label>
                        <input type="number" id="qtd_erros" min="0" required oninput="calcularDesempenhoModal()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Desempenho Calculado</label>
                    <input type="text" id="desempenho_calculado" readonly style="background:#E5E7EB; font-weight:bold; color:#111;">
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="fecharModal()" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Revisão (Bottom Sheet) -->
    <div id="modal-revisao" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Revisão Pendente</h2>
                <button onclick="fecharModalRevisao()" class="close-btn">&times;</button>
            </div>
            <div class="table-responsive">
                <table class="table-revisao">
                    <thead>
                        <tr><th>Matéria</th><th>Conteúdo</th><th>Data</th></tr>
                    </thead>
                    <tbody id="revisao-body"></tbody>
                </table>
            </div>
            <div class="modal-actions mt-1">
                <button type="button" onclick="fecharModalRevisao()" class="btn-secondary">Fechar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
